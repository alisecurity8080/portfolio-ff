<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | The Next Generation Institute</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-page"><div class="auth-card">
<h1>Reset Password</h1><p class="sub">Receive a one-time code by WhatsApp or SMS (online mode required).</p>
<label for="ch">Delivery channel</label><select id="ch"><option>WhatsApp</option><option>SMS</option></select>
<label for="ph">Registered phone number</label><input id="ph" value="+923001234567">
<button class="btn warn" id="send" type="button">Send OTP</button>
<div id="otp" class="otp-box hidden" style="margin-top:14px"></div>
<hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
<label for="code">OTP code</label><input id="code" inputmode="numeric" placeholder="6-digit code">
<label for="np">New password</label><input id="np" type="password" placeholder="At least 6 characters">
<button class="btn ok" id="ok" type="button" style="width:100%;justify-content:center">Update Password</button>
<p class="msg" id="m"></p>
<p style="text-align:center;margin:10px 0 0"><a href="index.html">← Back to login</a></p>
</div></div>
<script src="js/app.js"></script>
<script>
const S=App.state,say=(t,ok)=>{m.className='msg '+(ok?'good':'err');m.textContent=t};
send.onclick=()=>{
 if(!S.isOnline)return say('No internet. Switch to online mode first (Settings page, after login).');
 if(ph.value.replace(/[\s-]/g,'')!==S.admin.phone)return say('This number is not the registered admin number.');
 const c=String(Math.floor(100000+Math.random()*900000));
 S.pendingOtp={code:c,channel:ch.value,phone:S.admin.phone,exp:Date.now()+5*60000};App.save();
 otp.classList.remove('hidden');otp.textContent=`[Simulated ${ch.value} to ${S.admin.phone}] Your code is ${c} (valid 5 min)`;say('');};
ok.onclick=()=>{const o=S.pendingOtp;
 if(!o||code.value.trim()!==o.code)return say('Invalid OTP code.');
 if(Date.now()>o.exp)return say('OTP expired. Request a new one.');
 if(np.value.length<6)return say('Password must be at least 6 characters.');
 S.admin.passwordHash=btoa(np.value);S.pendingOtp=null;App.save();say('Password updated. You can log in now.',true);};
</script></body></html>
