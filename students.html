<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main class="content">
<div class="card">
 <div class="card-head"><h3>All Students</h3><a class="btn ok" href="student-form.html">+ Add Student</a></div>
 <div class="toolbar"><input id="q" placeholder="Search name, class or phone…"><select id="cls"></select></div>
 <div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Guardian Contact</th><th>Monthly Fee</th><th>Unpaid</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main></div></div><script src="js/app.js"></script>
<script>
if(App.page('students','Students','Add, edit and remove students')){
 const S=App.state,E=App.esc;
 function classes(){const c=[...new Set(S.students.map(s=>s.className))].sort();const cur=cls.value;
  cls.innerHTML='<option value="">All classes</option>'+c.map(x=>`<option ${x===cur?'selected':''}>${E(x)}</option>`).join('');}
 function render(){
  const t=q.value.toLowerCase(),c=cls.value;
  const list=S.students.filter(s=>(!c||s.className===c)&&(s.name+s.className+s.phone).toLowerCase().includes(t));
  tb.innerHTML=list.length?list.map(s=>{const n=App.unpaid(s).length;return `<tr>
   <td><b>${E(s.name)}</b></td><td>${E(s.className)}</td><td>${E(s.phone)}<br><small style="color:var(--muted)">${E(s.channel)}</small></td>
   <td>${App.money(s.monthlyFee)}</td><td>${n}</td>
   <td><span class="pill ${App.isOverdue(s)?'bad':'ok'}">${App.isOverdue(s)?'3+ Months Overdue':'Normal'}</span></td>
   <td><div class="row"><a class="btn sm" href="student-form.html?id=${s.id}">Edit</a><button class="btn sm bad" data-del="${s.id}">Delete</button></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No students found</td></tr>';
 }
 tb.onclick=e=>{const id=+e.target.dataset.del;if(!id)return;const s=S.students.find(x=>x.id===id);
  if(!confirm(`Delete ${s.name}? This cannot be undone.`))return;
  S.students=S.students.filter(x=>x.id!==id);S.notified=S.notified.filter(x=>x!==id);App.save();classes();render();App.toast('Student deleted');};
 q.oninput=render;cls.onchange=render;classes();render();
}
</script></body></html>
