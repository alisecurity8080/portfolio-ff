<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | The Next Generation Institute</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-page"><div class="auth-card">
<h1>The Next Generation Institute</h1><p class="sub">Fee Management System — Admin / Accountant Login</p>
<div class="demo">Demo login: <b>admin</b> / <b>admin123</b></div>
<form id="f"><label for="u">Username</label><input id="u" value="admin" required autocomplete="username">
<label for="p">Password</label><input id="p" type="password" value="admin123" required autocomplete="current-password">
<button class="btn" style="width:100%;justify-content:center" type="submit">Login</button></form>
<p class="msg err" id="m"></p>
<p style="text-align:center;margin:14px 0 0"><a href="forgot-password.html">Forgot / change password?</a></p>
</div></div>
<script src="js/app.js"></script>
<script>
if(App.loggedIn())location.replace('dashboard.html');
document.getElementById('f').onsubmit=e=>{e.preventDefault();
 if(App.login(u.value.trim(),p.value))location.href='dashboard.html';else m.textContent='Invalid username or password.';};
</script></body></html>
